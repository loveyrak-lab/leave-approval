name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # Testcontainers ใช้ Docker ที่มีมากับ ubuntu-latest อยู่แล้ว ไม่ต้องตั้ง postgres เพิ่ม
      - name: Test
        run: npm test
